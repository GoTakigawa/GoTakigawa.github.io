/* ── HAMBURGER MENU CSS ── */
.gti-nav {
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;
  height:64px;
  background:rgba(10,10,8,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #1e1d1b;
  box-sizing: border-box;
}
.nav-logo { height:32px; mix-blend-mode:screen; }

.ham-wrap { position:relative; width:52px; height:52px; z-index:300; }
.ham-wrap::after { content:''; position:fixed; top:0; right:0; width:372px; height:100vh; pointer-events:none; }
.ham-wrap:hover::after, .ham-wrap.active::after { pointer-events:all; }
.ham { display:flex; flex-direction:column; justify-content:center; align-items:flex-end; gap:8px; width:52px; height:52px; cursor:pointer; background:none; border:none; padding:12px; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
.ham span { display:block; width:100%; height:1px; background:#f0ede6; transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .25s; transform-origin:center; }
.ham.open span:nth-child(1) { transform:translateY(8px) rotate(45deg); }
.ham.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
.ham.open span:nth-child(3) { transform:translateY(-8px) rotate(-45deg); }

.overlay { position:fixed; inset:0; z-index:240; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .4s; }
.overlay.visible { opacity:1; pointer-events:all; }

.drawer { position:fixed; top:0; right:0; width:320px; height:100vh; background:#0d0d0b; border-left:1px solid #1e1d1b; z-index:250; display:flex; flex-direction:column; justify-content:center; padding:80px 0; transform:translateX(100%); transition:transform .5s cubic-bezier(.16,1,.3,1); box-sizing: border-box; overflow-y:auto; }
.drawer.open { transform:translateX(0); }
.drawer a { position:relative; display:flex; align-items:center; justify-content:space-between; padding:15px 40px; border-bottom:1px solid #1e1d1b; text-decoration:none; overflow:hidden; opacity:0; transform:translateX(16px); transition:background .25s,opacity .4s cubic-bezier(.16,1,.3,1),transform .4s cubic-bezier(.16,1,.3,1); }
.drawer a:first-child { border-top:1px solid #1e1d1b; }
.drawer a::after { content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:#6b21d6; transform:scaleX(0); transform-origin:left; transition:transform .4s cubic-bezier(.16,1,.3,1); }
.drawer a:hover { background:rgba(107,33,214,.07); }
.drawer a:hover::after { transform:scaleX(1); }
.drawer.open a { opacity:1; transform:translateX(0); }
.drawer.open a:nth-child(1) { transition-delay:.04s; }
.drawer.open a:nth-child(2) { transition-delay:.07s; }
.drawer.open a:nth-child(3) { transition-delay:.10s; }
.drawer.open a:nth-child(4) { transition-delay:.13s; }
.drawer.open a:nth-child(5) { transition-delay:.16s; }
.drawer.open a:nth-child(6) { transition-delay:.19s; }
.drawer.open a:nth-child(7) { transition-delay:.22s; }
.drawer.open a:nth-child(8) { transition-delay:.25s; }
.drawer.open a:nth-child(9) { transition-delay:.28s; }
.drawer.open a:nth-child(10) { transition-delay:.31s; }
.drawer.open a:nth-child(11) { transition-delay:.34s; }
.drawer.open a:nth-child(12) { transition-delay:.37s; }
.drawer.open a:nth-child(13) { transition-delay:.40s; }

/* ── CG CONCEPT GALLERY ── */
.cg-main { max-width: 1400px; margin: 0 auto; padding: 60px 40px 100px; box-sizing: border-box; }
.cg-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 40px;
}
@media (max-width: 1100px) { .cg-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .cg-grid { grid-template-columns: 1fr; padding: 0 4px; } }

.cg-item {
  position: relative;
  background: #080808;
  border: 1px solid #111;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
}
.cg-item:hover {
  border-color: #333;
  transform: translateY(-5px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.cg-item-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #000;
  cursor: pointer;
}
.cg-item-img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  transition: transform 0.6s ease;
}
.cg-item:hover .cg-item-img { transform: scale(1.05); }

/* 複数枚CG画像のスライド表示 */
.cg-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.cg-slide.active { opacity: 1; z-index: 1; }
.cg-nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(240,237,230,0.25);
  color: #f0ede6;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.25s ease, background 0.25s ease;
  z-index: 3;
  font-family: 'DIN Condensed', sans-serif;
  font-size: 1.1rem;
  line-height: 1;
  padding: 0;
}
.cg-item-img-wrap:hover .cg-nav-btn { opacity: 1; }
.cg-nav-btn:hover { background: rgba(107,33,214,0.85); border-color: rgba(107,33,214,0.85); }
.cg-nav-prev { left: 10px; }
.cg-nav-next { right: 10px; }
.cg-dots {
  position: absolute;
  bottom: 12px;
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 6px;
  z-index: 3;
}
.cg-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(240,237,230,0.35);
  cursor: pointer;
  transition: background 0.25s ease, transform 0.25s ease;
}
.cg-dot.active { background: #f0ede6; transform: scale(1.3); }

/* 画像がまだ無いプレースホルダー枠（実画像が入ったら .cg-item-img-wrap の中身をimgタグに差し替えるだけでOK） */
.cg-item-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  color: #3a3a3a;
  background: repeating-linear-gradient(135deg, #0d0d0d, #0d0d0d 10px, #111 10px, #111 20px);
}
.cg-item-placeholder svg { width: 32px; height: 32px; opacity: 0.5; }
.cg-item-placeholder span {
  font-family: 'DIN Condensed', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #555;
}

.cg-item-info { padding: 22px 25px; background: #080808; border-top: 1px solid #111; }
.cg-item-title {

  font-size: 1.1rem;
  margin-bottom: 8px;
  color: #fff;
}
.cg-item-desc {
  font-size: 0.85rem;
  color: #666;
  font-family: 'DIN Condensed', sans-serif;
  letter-spacing: 0.02em;
  line-height: 1.5;
}

/* ── Lightbox Modal ── */
.cg-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.98);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.3s ease;

.cg-modal.show { display: flex; opacity: 1; }
.cg-modal-content {
  max-width: 1800px;
  width: 100%;
  height: 90vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;

.cg-modal-img-container {
  position: relative;
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  text-align: center;
}
.cg-modal-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  box-shadow: 0 30px 100px rgba(0,0,0,0.8);
}
.cg-modal-nav {
  position: absolute;
  top: 50%;
  width: 100%;
  display: flex;
  justify-content: space-between;
  transform: translateY(-50%);
  padding: 0 10px;
  pointer-events: none;
}
.cg-modal-nav-btn {
  background: rgba(0,0,0,0.5);

  border: 1px solid #444;

  height: 40px;

  pointer-events: auto;

.cg-modal-nav-btn:hover { background: #6b21d6; border-color: #6b21d6; }
.cg-modal-close {
  position: absolute;
  top: -60px;
  right: 0;
  color: #fff;
  font-size: 2.5rem;
  cursor: pointer;
  background: none;
  border: none;
  transition: color 0.3s;

.cg-modal-close:hover { color: #6b21d6; }
.cg-modal-caption { margin-top: 30px; text-align: center; max-width: 600px; }
.cg-modal-title {

  font-size: 2rem;
  margin-bottom: 10px;
  color: #fff;
}
.cg-modal-counter { margin-top: 10px; font-size: 0.8rem; color: #666; }

// ── HAMBURGER MENU JS ──
(function(){
  const hamWrap=document.getElementById('hamWrap');
  const ham=document.getElementById('ham');
  const drawer=document.getElementById('drawer');
  const overlay=document.getElementById('overlay');
  if(!hamWrap || !ham || !drawer || !overlay) return;
  let closeTimer=null;
  let isTouch=false;
  function openDrawer(){
    clearTimeout(closeTimer);
    drawer.classList.add('open');
    overlay.classList.add('visible');
    ham.classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeDrawer(){
    clearTimeout(closeTimer);
    closeTimer=setTimeout(()=>{
      drawer.classList.remove('open');
      overlay.classList.remove('visible');
      ham.classList.remove('open');
      document.body.style.overflow='';
    },120);
  }
  function toggleDrawer(){
    drawer.classList.contains('open') ? closeDrawer() : openDrawer();
  }
  // Touch: tap to toggle
  ham.addEventListener('touchstart',function(e){
    isTouch=true;
    e.preventDefault();
    toggleDrawer();
  },{passive:false});
  // Mouse: hover (desktop only)
  hamWrap.addEventListener('mouseenter',function(){ if(!isTouch) openDrawer(); });
  hamWrap.addEventListener('mouseleave',function(){ if(!isTouch) closeDrawer(); });
  drawer.addEventListener('mouseenter',function(){ if(!isTouch) clearTimeout(closeTimer); });
  drawer.addEventListener('mouseleave',function(){ if(!isTouch) closeDrawer(); });
  overlay.addEventListener('click', closeDrawer);
  overlay.addEventListener('touchstart',function(e){ e.preventDefault(); closeDrawer(); },{passive:false});
  window.addEventListener('mousemove',function(){ isTouch=false; },{passive:true});
})();

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ── ライトボックス(拡大表示) ──
  var cgModal = document.getElementById('cgModal');
  var cgModalImg = document.getElementById('cgModalImg');
  var cgModalTitle = document.getElementById('cgModalTitle');
  var cgModalCounter = document.getElementById('cgModalCounter');
  var cgModalPrev = document.getElementById('cgModalPrev');
  var cgModalNext = document.getElementById('cgModalNext');
  var cgModalClose = document.getElementById('cgModalClose');
  var cgCurrentImages = [];
  var cgCurrentTitle = '';
  var cgCurrentIdx = 0;

  function cgUpdateModal(){
    cgModalImg.src = cgCurrentImages[cgCurrentIdx];
    cgModalImg.alt = cgCurrentTitle;
    cgModalTitle.textContent = cgCurrentTitle;
    if(cgCurrentImages.length > 1){
      cgModalCounter.textContent = (cgCurrentIdx + 1) + ' / ' + cgCurrentImages.length;
      cgModalPrev.style.display = 'block';
      cgModalNext.style.display = 'block';
    } else {
      cgModalCounter.textContent = '';
      cgModalPrev.style.display = 'none';
      cgModalNext.style.display = 'none';
    }
  }

  function cgOpenModal(images, title, startIdx){
    if(!cgModal) return;
    cgCurrentImages = images;
    cgCurrentTitle = title;
    cgCurrentIdx = startIdx || 0;
    cgUpdateModal();
    cgModal.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function cgCloseModal(){
    if(!cgModal) return;
    cgModal.classList.remove('show');
    document.body.style.overflow = '';
  }

  if(cgModalPrev) cgModalPrev.addEventListener('click', function(e){
    e.stopPropagation();
    cgCurrentIdx = (cgCurrentIdx - 1 + cgCurrentImages.length) % cgCurrentImages.length;
    cgUpdateModal();
  });
  if(cgModalNext) cgModalNext.addEventListener('click', function(e){
    e.stopPropagation();
    cgCurrentIdx = (cgCurrentIdx + 1) % cgCurrentImages.length;
    cgUpdateModal();
  });
  if(cgModalClose) cgModalClose.addEventListener('click', cgCloseModal);
  if(cgModal) cgModal.addEventListener('click', function(e){
    if(e.target === cgModal) cgCloseModal();
  });
  document.addEventListener('keydown', function(e){
    if(!cgModal || !cgModal.classList.contains('show')) return;
    if(e.key === 'Escape') cgCloseModal();
    if(e.key === 'ArrowLeft' && cgModalPrev) cgModalPrev.click();
    if(e.key === 'ArrowRight' && cgModalNext) cgModalNext.click();
  });

  function renderGrid(){
    var grid = document.getElementById('cgGrid');
    if(!grid) return;
    var html = CG_MODELS.map(function(m, mi){
      var slides = m.images.map(function(src, i){
        return '<div class="cg-slide' + (i===0 ? ' active' : '') + '" data-idx="' + i + '">' +
                 '<img class="cg-item-img" src="' + src + '" alt="' + escapeHtml(m.title) + '" loading="lazy">' +
               '</div>';
      }).join('');
      var nav = '';
      if(m.images.length > 1){
        nav += '<button class="cg-nav-btn cg-nav-prev" type="button" aria-label="Previous image">‹</button>';
        nav += '<button class="cg-nav-btn cg-nav-next" type="button" aria-label="Next image">›</button>';
        nav += '<div class="cg-dots">' + m.images.map(function(_, i){
          return '<span class="cg-dot' + (i===0 ? ' active' : '') + '" data-idx="' + i + '"></span>';
        }).join('') + '</div>';
      }
      var desc = m.images.length > 1 ? (m.images.length + ' views') : 'CG concept render';
      return '<div class="cg-item" data-model="' + mi + '">' +
               '<div class="cg-item-img-wrap">' + slides + nav + '</div>' +
               '<div class="cg-item-info">' +
                 '<div class="cg-item-title">' + escapeHtml(m.title) + '</div>' +
                 '<div class="cg-item-desc">' + desc + '</div>' +
               '</div>' +
             '</div>';
    }).join('');
    grid.innerHTML = html;

    // スライダーのイベント配線 + クリックで拡大表示
    var items = grid.querySelectorAll('.cg-item');
    items.forEach(function(item){
      var mi = parseInt(item.getAttribute('data-model'), 10);
      var model = CG_MODELS[mi];
      var slides = item.querySelectorAll('.cg-slide');
      var dots = item.querySelectorAll('.cg-dot');
      var idx = 0;
      function show(n){
        idx = (n + slides.length) % slides.length;
        slides.forEach(function(s, i){ s.classList.toggle('active', i === idx); });
        dots.forEach(function(d, i){ d.classList.toggle('active', i === idx); });
      }
      if(slides.length > 1){
        var prevBtn = item.querySelector('.cg-nav-prev');
        var nextBtn = item.querySelector('.cg-nav-next');
        if(prevBtn) prevBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); show(idx - 1); });
        if(nextBtn) nextBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); show(idx + 1); });
        dots.forEach(function(d, i){
          d.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); show(i); });
        });
      }
      var imgWrap = item.querySelector('.cg-item-img-wrap');
      if(imgWrap && model){
        imgWrap.addEventListener('click', function(){
          cgOpenModal(model.images, model.title, idx);
        });
      }
    });
  }

  renderGrid();
})();
</script>

</body>
</html>
