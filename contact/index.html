<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - GTI / Luthier</title>
  <meta name="description" content="Contact Go Takigawa Instruments for custom guitar, bass, and instrument-design inquiries.">
  <link rel="canonical" href="https://www.gtinstruments.xyz/contact/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    .contact-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px 100px;
    }

    .contact-header {
      text-align: center;
      padding: 100px 0 60px;
    }
    
    .contact-header h1 {
      font-family: 'Libre Baskerville', serif;
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .contact-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 60px;
    }

    .info-item h3 {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--accent);
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    
    .info-item p {
      color: #fff;
      font-size: 1.1rem;
    }

    /* Form Styles */
    .contact-form {
      background: #080808;
      padding: 40px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
      color: #888;
    }

    .form-control {
      width: 100%;
      background: #000;
      border: 1px solid #222;
      padding: 12px 15px;
      color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1rem;
      border-radius: 2px;
      transition: border-color 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea.form-control {
      min-height: 150px;
      resize: vertical;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 15px;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 20px;
    }

    .btn-submit:hover {
      background: var(--accent-warm);
    }
    .form-note {
      margin-top: 16px;
      color: #777;
      font-size: 0.78rem;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .contact-container { padding: 64px 16px 60px; }
      .contact-header { padding: 60px 0 40px; }
      .contact-header h1 { font-size: 2.2rem; }
      .contact-info-grid { grid-template-columns: 1fr; gap: 20px; }
      .contact-form { padding: 25px; }
    }
  </style>

<style>
/* ── HAMBURGER MENU CSS ── */
.gti-nav {
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;
  height:64px;
  background:rgba(10,10,8,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #1e1d1b;
  box-sizing: border-box;
}
.nav-logo { height:32px; mix-blend-mode:screen; }
.nav-right { display:flex; align-items:center; gap:16px; }
.lang-toggle { display:flex; align-items:center; gap:2px; border:1px solid #333330; border-radius:3px; padding:3px; }
.lang-btn { appearance:none; -webkit-appearance:none; background:transparent; border:none; color:#777; font-family:'Noto Sans JP', sans-serif; font-weight:500; letter-spacing:0.02em; font-size:0.78rem; padding:5px 11px; border-radius:2px; cursor:pointer; transition:background .25s, color .25s; }
.lang-btn:hover { color:#f0ede6; }
.lang-btn.active { background:var(--accent); color:#fff; cursor:default; }

.ham-wrap { position:relative; width:52px; height:52px; z-index:300; }
.ham-wrap::after { content:''; position:fixed; top:0; right:0; width:372px; height:100vh; pointer-events:none; }
.ham-wrap:hover::after, .ham-wrap.active::after { pointer-events:all; }
.ham { display:flex; flex-direction:column; justify-content:center; align-items:flex-end; gap:8px; width:52px; height:52px; cursor:pointer; background:none; border:none; padding:12px; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
.ham span { display:block; width:100%; height:1px; background:#f0ede6; transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .25s; transform-origin:center; }
.ham.open span:nth-child(1) { transform:translateY(8px) rotate(45deg); }
.ham.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
.ham.open span:nth-child(3) { transform:translateY(-8px) rotate(-45deg); }

.overlay { position:fixed; inset:0; z-index:240; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .4s; }
.overlay.visible { opacity:1; pointer-events:all; }

.drawer { position:fixed; top:0; right:0; width:320px; height:100vh; background:#0d0d0b; border-left:1px solid #1e1d1b; z-index:250; display:flex; flex-direction:column; justify-content:center; padding:80px 0; transform:translateX(100%); transition:transform .5s cubic-bezier(.16,1,.3,1); box-sizing: border-box; overflow-y:auto; }
.drawer.open { transform:translateX(0); }
.drawer a { position:relative; display:flex; align-items:center; justify-content:space-between; padding:15px 40px; border-bottom:1px solid #1e1d1b; text-decoration:none; overflow:hidden; opacity:0; transform:translateX(16px); transition:background .25s,opacity .4s cubic-bezier(.16,1,.3,1),transform .4s cubic-bezier(.16,1,.3,1); }
.drawer a:first-child { border-top:1px solid #1e1d1b; }
.drawer a::after { content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:#6b21d6; transform:scaleX(0); transform-origin:left; transition:transform .4s cubic-bezier(.16,1,.3,1); }
.drawer a:hover { background:rgba(107,33,214,.07); }
.drawer a:hover::after { transform:scaleX(1); }
.drawer.open a { opacity:1; transform:translateX(0); }
.drawer.open a:nth-child(1) { transition-delay:.04s; }
.drawer.open a:nth-child(2) { transition-delay:.07s; }
.drawer.open a:nth-child(3) { transition-delay:.10s; }
.drawer.open a:nth-child(4) { transition-delay:.13s; }
.drawer.open a:nth-child(5) { transition-delay:.16s; }
.drawer.open a:nth-child(6) { transition-delay:.19s; }
.drawer.open a:nth-child(7) { transition-delay:.22s; }
.drawer.open a:nth-child(8) { transition-delay:.25s; }
.drawer.open a:nth-child(9) { transition-delay:.28s; }
.drawer.open a:nth-child(10) { transition-delay:.31s; }
.drawer.open a:nth-child(11) { transition-delay:.34s; }
.drawer.open a:nth-child(12) { transition-delay:.37s; }
.drawer.open a:nth-child(13) { transition-delay:.40s; }
.d-name { font-family:'Libre Baskerville',serif; font-size:1rem; color:rgba(240,237,230,.45); transition:color .25s; }
.drawer a:hover .d-name { color:#f0ede6; }
.d-arr { font-family:'Teko',sans-serif; font-size:.8rem; font-weight:300; color:#2e2d2a; opacity:0; transform:translateX(-6px); transition:color .25s,opacity .25s,transform .3s cubic-bezier(.16,1,.3,1); }
.drawer a:hover .d-arr { opacity:1; transform:translateX(0); color:#6b21d6; }
@media(max-width:900px){ .gti-nav{padding:0 28px; height:60px;} }
@media(max-width:600px){ .gti-nav{padding:0 16px; height:56px;} .drawer{width:100%;} }
@media(hover:none){
  /* タッチデバイスではhoverブリッジ不要 */
  .ham-wrap::after{display:none;}
}
</style>
</head>

  <main class="contact-container">
    <div class="contact-header">
      <h1 data-ja="Contact" data-en="Contact">Contact</h1>
      <p style="color: #666;" data-ja="カスタムオーダーやお問い合わせは、お気軽にご連絡ください。" data-en="Get in touch for custom orders or inquiries.">カスタムオーダーやお問い合わせは、お気軽にご連絡ください。</p>
    </div>

      <div class="info-item">
        <h3 data-ja="メールアドレス" data-en="Email">メールアドレス</h3>

      </div>
      <div class="info-item">
        <h3 data-ja="所在地" data-en="Location">所在地</h3>
        <p data-ja="東京都" data-en="Tokyo, Japan">東京都</p>
      </div>
    </div>

    <form class="contact-form" id="contact-form">
      <div class="form-group">
        <label for="name" data-ja="お名前" data-en="Name">お名前</label>
        <input type="text" id="name" name="name" class="form-control" autocomplete="name" placeholder="お名前をご記入ください" data-ja-placeholder="お名前をご記入ください" data-en-placeholder="Your Name" required>

      <div class="form-group">
        <label for="email" data-ja="メールアドレス" data-en="Email">メールアドレス</label>
        <input type="email" id="email" name="email" class="form-control" autocomplete="email" placeholder="メールアドレスをご記入ください" data-ja-placeholder="メールアドレスをご記入ください" data-en-placeholder="Your Email Address" required>
      </div>
      <div class="form-group">
        <label for="subject" data-ja="件名" data-en="Subject">件名</label>

        <textarea id="message" name="message" class="form-control" placeholder="お問い合わせ内容をご記入ください..." data-ja-placeholder="お問い合わせ内容をご記入ください..." data-en-placeholder="Write your message here..." required></textarea>

<script>
// ── CONTACT FORM ──
(function(){
  const form = document.getElementById('contact-form');
  if (!form) return;
  form.addEventListener('submit', function(event){
    event.preventDefault();
    const data = new FormData(form);
    const subject = `[GTI website] ${data.get('subject') || 'Inquiry'}`;
    const body = `Name: ${data.get('name') || ''}\nEmail: ${data.get('email') || ''}\n\n${data.get('message') || ''}`;
    window.location.href = `mailto:gotakigawa@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  });
})();

// ── LANGUAGE TOGGLE (JA default / EN) ──
(function(){
  const STORAGE_KEY = 'gti-lang';
  const langBtns = document.querySelectorAll('.lang-btn');
  function applyLang(lang){
    document.querySelectorAll('[data-ja][data-en]').forEach(function(el){
      el.textContent = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-ja');
    });
    document.querySelectorAll('[data-ja-placeholder][data-en-placeholder]').forEach(function(el){
      el.setAttribute('placeholder', lang === 'en' ? el.getAttribute('data-en-placeholder') : el.getAttribute('data-ja-placeholder'));
    });
    document.documentElement.setAttribute('lang', lang);
    langBtns.forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    try { localStorage.setItem(STORAGE_KEY, lang); } catch(e){}
  }
  let initialLang = 'ja';
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved === 'en' || saved === 'ja') initialLang = saved;
  } catch(e){}
  applyLang(initialLang);
  langBtns.forEach(function(b){
    b.addEventListener('click', function(){
      applyLang(b.getAttribute('data-lang'));
    });
  });
})();

// ── HAMBURGER MENU JS ──
(function(){
  const hamWrap=document.getElementById('hamWrap');
  const ham=document.getElementById('ham');
  const drawer=document.getElementById('drawer');
  const overlay=document.getElementById('overlay');
  if(!hamWrap || !ham || !drawer || !overlay) return;
  let closeTimer=null;
  let isTouch=false;
  function openDrawer(){
    clearTimeout(closeTimer);
    drawer.classList.add('open');
    overlay.classList.add('visible');
    ham.classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeDrawer(){
    clearTimeout(closeTimer);
    closeTimer=setTimeout(()=>{
      drawer.classList.remove('open');
      overlay.classList.remove('visible');
      ham.classList.remove('open');
      document.body.style.overflow='';
    },120);
  }
  function toggleDrawer(){
    drawer.classList.contains('open') ? closeDrawer() : openDrawer();
  }
  // Touch: tap to toggle
  ham.addEventListener('touchstart',function(e){
    isTouch=true;
    e.preventDefault();
    toggleDrawer();
  },{passive:false});
  // Mouse: hover (desktop only)
  hamWrap.addEventListener('mouseenter',function(){ if(!isTouch) openDrawer(); });
  hamWrap.addEventListener('mouseleave',function(){ if(!isTouch) closeDrawer(); });
  drawer.addEventListener('mouseenter',function(){ if(!isTouch) clearTimeout(closeTimer); });
  drawer.addEventListener('mouseleave',function(){ if(!isTouch) closeDrawer(); });
  overlay.addEventListener('click', closeDrawer);
  overlay.addEventListener('touchstart',function(e){ e.preventDefault(); closeDrawer(); },{passive:false});
  window.addEventListener('mousemove',function(){ isTouch=false; },{passive:true});
})();
</script>
